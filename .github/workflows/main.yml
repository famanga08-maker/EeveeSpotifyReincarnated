name: Auto Update AltStore Source

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to manually trigger it with a button click

jobs:
  update-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives GitHub Actions permission to save the updated JSON back to code

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run updater script
      run: python update_source.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add apps.json
        git diff-index --quiet HEAD || git commit -m "Automatically updated apps.json with latest release version"
        git push
